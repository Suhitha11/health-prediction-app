<!DOCTYPE html>
<html>
<head>
    <title>Edit Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 class="mb-4">Edit Patient Details</h2>

<form method="POST">

    <input type="text" name="fullname" value="{{ patient[1] }}" class="form-control mb-3" required>

    <input type="date" name="dob" value="{{ patient[2] }}" class="form-control mb-3" required>

    <input type="email" name="email" value="{{ patient[3] }}" class="form-control mb-3" required>

    <input type="number" name="glucose" value="{{ patient[4] }}" class="form-control mb-3" required>

    <input type="number" step="0.1" name="haemoglobin" value="{{ patient[5] }}" class="form-control mb-3" required>

    <input type="number" name="cholesterol" value="{{ patient[6] }}" class="form-control mb-3" required>

    <button type="submit" class="btn btn-success">Update Patient</button>

    <a href="/" class="btn btn-secondary">Cancel</a>

</form>

</body>
</html>
